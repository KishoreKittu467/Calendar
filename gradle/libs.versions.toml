[versions]
agp = "8.13.1"

# Do not remove these versions even if they are not used directly
android-minSdk = "24"
android-compileSdk = "36"
android-targetSdk = "36"

androidx-activityCompose = "1.12.0"
androidx-appcompat = "1.7.1"
androidx-core-ktx = "1.17.0"
materialIcons = "1.7.3"

composeMultiplatform = "1.9.3"
kotlin = "2.2.21"
koin = "4.1.1"
ktor = "3.3.2"
ksoup = "0.6.0"
jetbrainsMarkdown = "0.7.3"

logback = "1.5.21"
google-services = "4.4.4"
kotlinx-coroutines = "1.10.2"
androidx-lifecycle = "2.9.6"
coil3 = "3.3.0"
androidxNavigation = "2.9.1"
kotlinSerialization = "1.9.0"
kotlinter = "5.3.0"
dateTime = "0.7.1"

bvc = "0.18.1"
version = "0.53.0"
mavenPublish = "0.35.0"
nexusPublish = "2.0.0"

ksp = "2.3.2"
# ios build is not working with versions sqlite = "2.5.0-alpha11" & room = "2.7.0-alpha11"
# web build only working with versions sqlite = "2.5.0-alpha11" & room = "2.7.0-alpha11"
#sqlite = "2.5.0-rc01"
#room = "2.7.0-rc01"
sqlite = "2.6.2"
room = "2.8.4"

#androidx-material = "1.13.0"
#androidx-constraintlayout = "2.2.1"
#androidx-test-junit = "1.3.0"
#material3 = "1.4.0"
#espresso = "3.7.0"
#junit5 = "5.13.4"
#firebaseFirestore = "25.1.2"
#composeAndroid = "1.9.2"
#navigationCompose = "2.9.5"
#richeditor = "0.2.0"
#dokka = "2.0.0"


[libraries]

# common
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
#test-junit5-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit5" }
#test-junit5-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit5" }

androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "androidx-core-ktx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "androidx-appcompat" }
androidx-annotation = { module = "androidx.annotation:annotation", version = "1.9.1" }
#androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "androidx-constraintlayout" }
#androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidx-test-junit" }
#firebase-firestore = { group = "com.google.firebase", name = "firebase-firestore", version.ref = "firebaseFirestore" }

#compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "composeAndroid" }

androidx-lifecycle-viewmodel = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
jetbrains-compose-navigation = { group = "org.jetbrains.androidx.navigation", name = "navigation-compose", version.ref= "androidxNavigation"}
jetbrains-material-icons = { module = "org.jetbrains.compose.material:material-icons-core", version.ref = "materialIcons" }

kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "kotlinSerialization" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinSerialization" }

kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "dateTime" }

koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }
koin-core-coroutines = { group = "io.insert-koin", name = "koin-core-coroutines", version.ref = "koin" }

coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil3" }
coil-compose-core = { module = "io.coil-kt.coil3:coil-compose-core", version.ref = "coil3" }
coil-network-ktor3 = { module = "io.coil-kt.coil3:coil-network-ktor3", version.ref = "coil3" }
coil-mp = { module = "io.coil-kt.coil3:coil", version.ref = "coil3" }
coil-svg = { module = "io.coil-kt.coil3:coil-svg", version.ref = "coil3" }

ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-logging = { module = "io.ktor:ktor-client-logging", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-auth = { module = "io.ktor:ktor-client-auth", version.ref = "ktor" }

ksoup-html = { module = "com.mohamedrejeb.ksoup:ksoup-html", version.ref = "ksoup" }
ksoup-entities = { module = "com.mohamedrejeb.ksoup:ksoup-entities", version.ref = "ksoup" }
jetbrains-markdown = { module = "org.jetbrains:markdown", version.ref = "jetbrainsMarkdown" }

# android specific
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-androidx-compose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koin" }
compose-activity = { group = "androidx.activity", name = "activity-compose", version.ref = "androidx-activityCompose" }

kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinx-coroutines" }

#iOS specific
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }

# Desktop Specific
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
kotlinx-coroutines-swing = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing", version.ref = "kotlinx-coroutines" }

#nonJs Specific
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqlite" }

#wasmJs specific
ktor-client-js = { module = "io.ktor:ktor-client-js", version.ref = "ktor" }
ktor-client-wasm = { module = "io.ktor:ktor-client-js-wasm-js", version.ref = "ktor" }

# Server specific
ktor-server-core = { group = "io.ktor", name = "ktor-server-core-jvm", version.ref = "ktor" }
ktor-server-netty = { group = "io.ktor", name = "ktor-server-netty-jvm", version.ref = "ktor" }
ktor-server-tests = { group = "io.ktor", name = "ktor-server-test-host", version.ref = "ktor" }
logback = { group = "ch.qos.logback", name = "logback-classic", version.ref = "logback" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
koin-ktor = { module = "io.insert-koin:koin-ktor", version.ref = "koin" }

#kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib-jdk8", version.ref = "kotlin" }
#desugar = { module = "com.android.tools:desugar_jdk_libs", version = "2.1.5" }

# Other Non compose libraries
nexus-publish = { module = "io.github.gradle-nexus.publish-plugin:io.github.gradle-nexus.publish-plugin.gradle.plugin", version.ref = "nexusPublish" }
#androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version = "1.4.0" }
#androidx-cardview = { module = "androidx.cardview:cardview", version = "1.0.0" }
#material-view = { module = "com.google.android.material:material", version.ref = "androidx-material" }

#androidx-test-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }
#androidx-test-espresso-contrib = { module = "androidx.test.espresso:espresso-contrib", version.ref = "espresso" }
#androidx-test-runner = { module = "androidx.test:runner", version = "1.7.0" }
#androidx-test-rules = { module = "androidx.test:rules", version = "1.7.0" }
#test-junit4 = { module = "junit:junit", version = "4.13.2" }
#test-junit5-bom = { group = "org.junit", name = "junit-bom", version.ref = "junit5" }
#test-junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher" }

#compose-ui-ui = { module = "androidx.compose.ui:ui", version.ref = "composeAndroid" }
#compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "composeAndroid" }
#compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "composeAndroid" }
#compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
#compose-navigation = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }

#compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "composeAndroid" }
#compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "composeAndroid" }

#richeditor-compose = { module = "com.mohamedrejeb.richeditor:richeditor-compose", version.ref = "richeditor" }

[bundles]
koin = [
    "koin-compose",
    "koin-compose-viewmodel"
]
coil = [
    "coil-compose",
    "coil-compose-core",
    "coil-network-ktor3",
    "coil-mp",
    "coil-svg"
]
ktor-server = [
    "koin-ktor",
    "ktor-server-core",
    "ktor-server-netty",
    "ktor-server-tests",
]
ktor-client = [
    "ktor-client-core",
    "ktor-client-content-negotiation",
    "ktor-client-auth",
    "ktor-client-logging",
    "ktor-serialization-kotlinx-json",
]

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
jetbrainsCompose = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ktor = { id = "io.ktor.plugin", version.ref = "ktor" }
kotlinter = { id = "org.jmailen.kotlinter", version.ref = "kotlinter" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
googleServices = { id = "com.google.gms.google-services", version.ref = "google-services" }
native-cocoapods = { id = "org.jetbrains.kotlin.native.cocoapods", version.ref = "kotlin" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
room = { id = "androidx.room", version.ref = "room" }
bcv = { id = "org.jetbrains.kotlinx.binary-compatibility-validator", version.ref = "bvc" }
versionCheck = { id = "com.github.ben-manes.versions", version.ref = "version" }

kotlinAndroid = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
